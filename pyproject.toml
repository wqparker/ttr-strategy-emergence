[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ttr"
version = "0.1.0"
description = "Ticket to Ride as a multi-agent RL environment for studying emergent strategy"
requires-python = ">=3.9"
dependencies = [
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttr = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
