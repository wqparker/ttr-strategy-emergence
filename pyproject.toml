[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ttr"
version = "0.1.0"
description = "Ticket to Ride as a multi-agent RL environment for studying emergent strategy"
requires-python = ">=3.14"
dependencies = [
    "rich>=13",
]

[project.scripts]
# Installed into .venv/Scripts (.venv/bin elsewhere); the viewer ones need the [viz] extra.
ttr-sim = "ttr.simulate:main"
ttr-view = "ttr.viz.app:main"
ttr-shot = "ttr.viz.screenshot:main"
# Needs the [env] extra (numpy)
ttr-train-linear = "ttr.learn.linear:main"
# Needs the [analysis] extra (matplotlib)
ttr-dash = "ttr.learn.dashboard:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = ["pygame-ce>=2.5"]
# Strategy analysis: ttr.analysis rows into DataFrames (PLAN.md Phase 6)
analysis = ["pandas>=2", "matplotlib>=3.8"]
# The RL environment (PLAN.md Phase 4): the PettingZoo AEC env and its spaces
env = ["numpy>=1.24", "pettingzoo>=1.24", "gymnasium>=0.28"]
# scripts/fit_tiles.py: fitting board tiles to the board photo
photo = ["numpy>=1.24", "opencv-python-headless>=4.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttr = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
